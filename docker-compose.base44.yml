services:
  app:
    image: python:3.10-alpine3.21
    working_dir: /app
    restart: on-failure
    ports:
      - "3000:3000"
    volumes:
      - ./app:/app
    command: ["sh", "-ec", "pip install --no-cache-dir -r requirements.txt && exec flask run --reload --host 0.0.0.0 --port 3000"]
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=development
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
